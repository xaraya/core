sonar.projectKey=xaraya_core
sonar.organization=xaraya-core-24

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=core
#sonar.projectVersion=1.0

# Disable excluding based on .gitignore
sonar.scm.exclusions.disabled=true

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=html/
sonar.exclusions=html/docs/**,html/lib/creole/**,html/themes/**,html/var/**
sonar.tests=developer/tests/unit/

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8